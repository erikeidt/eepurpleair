
rest:
  - resource: "http://192.168.68.107/json?live=true"
    method: GET
    verify_ssl: false
    timeout: 60
    scan_interval: 90
    sensor:
      - name: "PA Air Quality"
        unique_id: "pa_air_quality"
        device_class: aqi 
        state_class: measurement
        value_template: >-
          {% set q1 = value_json['pm2.5_aqi'] | float %}
          {% set q2 = value_json['pm2.5_aqi_b'] | float %}
          {{ (q1 + q2) / 2 }}
      - name: "PA Air Temp (raw)"
        unique_id: "pa_air_temp_raw"
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        value_template: "{{ value_json.current_temp_f | float }}" 
      - name: "PA Air Temp"
        unique_id: "pa_air_temp"
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        value_template: >-
          {% set tf = value_json.current_temp_f | float %} 
          {{ 
            tf * 1.0227 - (tf-44)*0.37
              if tf > 60 else tf
          }}
      - name: "PA Humidity (raw)"
        unique_id: "pa_humidity_raw"
        unit_of_measurement: "%"
        value_template: "{{ value_json.current_humidity | float }}"
      - name: "PA Dewpoint"
        unique_id: "pa_dewpoint"
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "°F"
        value_template: "{{ value_json.current_dewpoint_f | float }}"
      - name: "PA Humidity"
        unique_id: "pa_humidity"
        unit_of_measurement: "%"
        value_template: >-
          {% set traw = value_json.current_temp_f | float %} 
          {% set tf = traw * 1.0227 - (traw-44)*0.37 if traw > 60 else traw %}
          {% set tc = (tf - 32) * 5 / 9 %}
          {% set dc = (value_json.current_dewpoint_f | float - 32) * 5 / 9 %}
          {% set ts = (17.625 * tc) / (243.04 + tc) %} 
          {% set ds = (17.625 * dc) / (243.04 + dc) %} 
          {{ ((e**ds) / (e**ts)) * 100 }}
rest_command:
  get_open_meteo:
    url: https://api.open-meteo.com/v1/forecast?{{querystring}}
    method: GET
    verify_ssl: false
    timeout: 90
    

